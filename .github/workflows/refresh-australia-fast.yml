name: Refresh Australian FAST and combined EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tv-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout TV guide repository
        uses: actions/checkout@v4

      - name: Checkout pinned EPG generator
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: 6a74973f1e0657184bf168e589a043ac66bac551
          path: epg-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: epg-source/package-lock.json

      - name: Install generator dependencies
        working-directory: epg-source
        run: npm ci

      - name: Prepare work directory
        run: mkdir -p epg-source/work

      - name: Build Australian source guides
        working-directory: epg-source
        run: |
          npm run grab -- --sites=abc.net.au --output=work/{site}.xml --days=7 --maxConnections=2
          npm run grab -- --sites=foxtel.com.au --output=work/{site}.xml --days=7 --maxConnections=2
          npm run grab -- --sites=foxsports.com.au --output=work/{site}.xml --days=7 --maxConnections=2

      - name: Fetch Eurotrasz Australian FAST guide
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/Eurotrasz/australia-epg/main/au_epg.xml \
            --output epg-source/work/eurotrasz-au.xml
          test -s epg-source/work/eurotrasz-au.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("epg-source/work/eurotrasz-au.xml").getroot()
          channels, programmes = len(root.findall("channel")), len(root.findall("programme"))
          print(f"Eurotrasz: {channels} channels, {programmes} programmes")
          if channels < 50 or programmes < 100:
              raise SystemExit("Eurotrasz feed failed coverage check")
          PY

      - name: Build and validate Australian and combined guides
        run: python3 build-australia-fast-guide.py

      - name: Publish the refreshed feeds
        run: |
          git config user.name "EPG Automation"
          git config user.email "epg-automation@users.noreply.github.com"
          git add au.xml.gz combined.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Australian FAST and combined EPG"
            git pull --rebase origin main
            git push
          else
            echo "Guides unchanged"
          fi
