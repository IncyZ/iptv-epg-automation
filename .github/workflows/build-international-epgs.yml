name: Build New Zealand, Canada and USA EPGs

on:
  workflow_dispatch:
  schedule:
    # Ireland and Ukraine run at 00:00 and 00:30 UTC.
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: tv-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout TV guide repository
        uses: actions/checkout@v4

      - name: Checkout pinned EPG generator
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: 6a74973f1e0657184bf168e589a043ac66bac551
          path: epg-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: epg-source/package-lock.json

      - name: Install generator dependencies
        working-directory: epg-source
        run: npm ci

      - name: Prepare work directory
        run: mkdir -p epg-source/work

      - name: Build Canada and USA main channel lists
        working-directory: epg-source
        run: npm run grab -- --channels=../channels-north-america.xml --output=work/north-america.xml --days=7 --maxConnections=5 --timeout=15000

      - name: Build Canada and USA supplementary channel lists
        working-directory: epg-source
        run: npm run grab -- --channels=../channels-north-america-extra.xml --output=work/north-america-extra.xml --days=7 --maxConnections=5 --timeout=15000

      - name: Build New Zealand source guide
        working-directory: epg-source
        run: npm run grab -- --sites=sky.co.nz --output=work/{site}.xml --days=7 --maxConnections=2

      - name: Split and merge country feeds
        run: python3 build-international-guides.py

      - name: Validate every published feed
        run: |
          python3 - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ("nz", "ca", "us", "combined"):
              path = Path(f"{name}.xml.gz")
              assert path.is_file() and path.stat().st_size > 0, f"{path} missing"
              with gzip.open(path, "rb") as stream:
                  root = ET.parse(stream).getroot()
              channels = len(root.findall("channel"))
              programmes = len(root.findall("programme"))
              print(f"{name.upper()}: {channels} channels, {programmes} programmes")
              assert channels and programmes, f"{name} feed is empty"
          PY

      - name: Publish country and combined feeds
        run: |
          git config user.name "EPG Automation"
          git config user.email "epg-automation@users.noreply.github.com"
          git add nz.xml.gz ca.xml.gz us.xml.gz combined.xml.gz build-international-guides.py
          if ! git diff --cached --quiet; then
            git commit -m "Update international country and combined EPG guides"
            git pull --rebase origin main
            git push
          else
            echo "Guides unchanged"
          fi
